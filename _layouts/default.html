<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site-data.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</head>
<body>

  <header>
    <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
    <span style="opacity: 0.7; font-size: 0.9rem;">{{ site.subtitle }}</span>
  </header>

  <div class="container">
    <aside class="sidebar-left">
      <input type="text" id="tree-search" class="search-box" placeholder="Search pages...">
      <div id="file-tree"></div>
    </aside>

    <main>
      <h1 style="margin-top:0;">{{ page.title }}</h1>
      <div class="markdown-body">
        {{ content }}
      </div>

    </main>

    <aside class="sidebar-right">
      <h3 class="toc-title">On this page</h3>
      <div id="toc-content"></div>
    </aside>
  </div>

</body>
</html>
