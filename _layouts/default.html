<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site-data.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</head>
<body>

  <header>
    <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
    <span>{{ site.subtitle }}</span>
  </header>

  <div class="container">
    <aside class="sidebar-left">
      <input type="text" id="tree-search" class="search-box" placeholder="Search pages…">
      <div id="file-tree"></div>
    </aside>

    <main>
      <h1>{{ page.title }}</h1>
      <div class="markdown-body">
        {{ content }}
      </div>
    </main>

    <aside class="sidebar-right">
      <h3 class="toc-title">On this page</h3>
      <div id="toc-content"></div>
    </aside>
  </div>

</body>
</html>
